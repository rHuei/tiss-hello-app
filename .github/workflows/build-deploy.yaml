# PR：只 build，確認能打包
# push 到 main：build → 推 GHCR → 更新 tiss-day2-gitops 的 image 版本 → Argo CD 自動同步
name: build-and-deploy

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: read
  packages: write            # 讓 GITHUB_TOKEN 能推 GHCR

env:
  GITOPS_REPO: rHuei/tiss-day2-gitops
  OVERLAY: hello/overlays/lab/kustomization.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - id: meta
      run: |
        echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hello" >> "$GITHUB_OUTPUT"

    - uses: docker/login-action@v3
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: gitops-update      # 連續 push 時一次只改一個，避免 git push 衝突
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}

    - name: Update image tag in GitOps repo
      run: |
        TAG=${{ needs.build.outputs.tag }}
        sed -i -E "s/^(\s*newTag:)\s*\S+/\1 ${TAG}/; s/VERSION=\S+/VERSION=${TAG}/" "$OVERLAY"
        git diff
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "hello: ${TAG} (from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
        git push
